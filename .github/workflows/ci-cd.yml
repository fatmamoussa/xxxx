name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-mlops-bank-churn1
  ACR_NAME: mlopsfatma1766152038
  CONTAINER_APP_NAME: bank-churn
  IMAGE_NAME: churn-api
  CONTAINERAPPS_ENV: env-mlops-workshop  # Fixed environment name
  AZURE_CLI_VERSION: 2.81.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=term

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure CLI
        uses: azure/CLI@v1
        with:
          azcliversion: ${{ env.AZURE_CLI_VERSION }}
          inlineScript: |
            az version

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # First check if the environment exists
      - name: Check Container Apps Environment
        uses: azure/CLI@v1
        with:
          azcliversion: ${{ env.AZURE_CLI_VERSION }}
          inlineScript: |
            echo "Checking Container Apps Environment..."
            az extension add --name containerapp --upgrade
            
            # List available environments
            echo "Available Container Apps Environments:"
            az containerapp env list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[].name" -o tsv || true
            
            # Check if our target environment exists
            if az containerapp env show --name ${{ env.CONTAINERAPPS_ENV }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} &> /dev/null; then
              echo "✅ Environment '${{ env.CONTAINERAPPS_ENV }}' exists."
            else
              echo "❌ Environment '${{ env.CONTAINERAPPS_ENV }}' not found!"
              echo "Available environments in resource group:"
              az containerapp env list --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
              exit 1
            fi

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          echo "🔨 Building Docker image..."
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          echo "✅ Docker image pushed"

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          azcliversion: ${{ env.AZURE_CLI_VERSION }}
          inlineScript: |
            echo "Deploying to Container App: ${{ env.CONTAINER_APP_NAME }}"
            echo "Using environment: ${{ env.CONTAINERAPPS_ENV }}"
            
            # Verify the environment one more time
            ENV_ID=$(az containerapp env show \
              --name ${{ env.CONTAINERAPPS_ENV }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query id -o tsv)
            
            echo "Environment ID: $ENV_ID"
            
            if ! az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} &> /dev/null; then
              echo "🚀 Container App does not exist. Creating..."
              az containerapp create \
                --name ${{ env.CONTAINER_APP_NAME }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --environment ${{ env.CONTAINERAPPS_ENV }} \
                --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                --cpu 0.5 --memory 1.0Gi \
                --ingress external \
                --target-port 80 \
                --min-replicas 1 --max-replicas 3
            else
              echo "🔄 Container App exists. Updating..."
              az containerapp update \
                --name ${{ env.CONTAINER_APP_NAME }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            fi

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          APP_URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "Application deployed at: https://$APP_URL"
          echo "Waiting for application to be ready..."
          sleep 30
          
          # Try multiple times to account for startup time
          for i in {1..5}; do
            echo "Attempt $i to check application health..."
            if curl -f -s -o /dev/null -w "%{http_code}" https://$APP_URL/health; then
              echo ""
              echo "✅ Deployment successful! Health check passed."
              exit 0
            fi
            sleep 10
          done
          
          echo "❌ Health check failed after multiple attempts"
          exit 1